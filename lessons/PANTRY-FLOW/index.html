<body>
    <h1>Pantry Flow</h1>
    <h2>Simple pantry control</h2>

    <main>
        <div class="title"><h3>Products</h3> <h3>Amount</h3></div>

            <h4>Milk</h4>
            <div class="controls"><button class="btn-minus" type="button">-</button><span class="amount">0</span><button class="btn-plus" type="button">+</button></div>
        </div>

        <div class="product-card">
            <h4>Rice</h4>
            <div class="controls"><button class="btn-minus" type="button">-</button><span class="amount">0</span><button class="btn-plus" type="button">+</button></div>
        </div>

        <div class="product-card">
            <h4>Eggs</h4>
            <div class="controls"><button class="btn-minus" type="button">-</button><span class="amount">0</span><button class="btn-plus" type="button">+</button></div>
        </div>
        
       

    </main>
    
    <script src="script.js"></script>
